<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYD Control — Live Log</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; border-bottom: 1px solid #30363d; display: flex; gap: 8px;
           flex-wrap: wrap; align-items: center; }
  header button { background: #21262d; color: #e6edf3; border: 1px solid #30363d;
                  border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  header button:hover:not(:disabled) { background: #30363d; }
  header button:disabled { opacity: .45; cursor: not-allowed; }
  #status { margin-left: auto; font-size: 13px; color: #8b949e; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; white-space: pre-wrap;
         word-break: break-word; font-size: 13px; line-height: 1.6; }
  #log .ts { color: #58a6ff; }
  #log .err { color: #f85149; }
  #log .done { color: #3fb950; }
</style>
</head>
<body>
<header>
  <button data-q="lock">Lock</button>
  <button data-q="unlock">Unlock</button>
  <button data-q="headlights">Headlights</button>
  <button data-q="honk">Honk</button>
  <button data-q="trunk_open">Trunk Open</button>
  <button data-q="trunk_close">Trunk Close</button>
  <button data-q="windows_close">Windows Close</button>
  <button data-q="engine_off">Engine Off</button>
  <span id="status">idle</span>
</header>
<pre id="log"></pre>
<script>
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  // Optional API key: /control.html?key=YOUR_KEY (or pass &key= on each call)
  const apiKey = new URLSearchParams(location.search).get('key') || '';

  const stamp = () => new Date().toLocaleTimeString();

  function append(text, cls) {
    const div = document.createElement('div');
    const t = document.createElement('span');
    t.className = 'ts';
    t.textContent = `[${stamp()}] `;
    div.appendChild(t);
    const body = document.createElement('span');
    body.textContent = text;
    if (cls) body.className = cls;
    div.appendChild(body);
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  const POLL_MS = 500;   // how often we fetch new lines
  const MAX_MS = 90_000; // safety cap so we never poll forever

  async function run(q) {
    logEl.textContent = '';
    const buttons = document.querySelectorAll('header button');
    buttons.forEach(b => (b.disabled = true));
    statusEl.textContent = 'connecting…';

    const key = apiKey ? `&key=${encodeURIComponent(apiKey)}` : '';

    // 1. Start the action — this returns quickly with a session id.
    let session, dryRun = false;
    try {
      const resp = await fetch(`/api/control?q=${encodeURIComponent(q)}${key}`);
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        append(`HTTP ${resp.status} ${data.detail || data.error || ''}`.trim(), 'err');
        statusEl.textContent = `failed (HTTP ${resp.status})`;
        return;
      }
      session = data.session;
      dryRun = !!data.dry_run;
      append(`[byd-control] action=${data.action} session=${session} connected`);
      if (dryRun) append('[byd-control] dry-run mode — simulating phone output');
    } catch (err) {
      append(String(err), 'err');
      statusEl.textContent = 'error';
      return;
    }

    // 2. Poll for new lines every POLL_MS. No long-lived stream, so it works
    //    even when the server buffers chunked responses (Vercel Python).
    const started = Date.now();
    let offset = 0;
    let done = false;

    try {
      while (!done && Date.now() - started < MAX_MS) {
        const r = await fetch(
          `/api/control/poll?session=${encodeURIComponent(session)}&offset=${offset}${key}`
        );
        if (!r.ok) {
          const detail = await r.text().catch(() => '');
          append(`poll HTTP ${r.status} ${detail}`.trim(), 'err');
          statusEl.textContent = `poll failed (HTTP ${r.status})`;
          break;
        }
        const data = await r.json();
        for (const line of (data.lines || [])) {
          // Don't surface the internal completion sentinel itself.
          if (line && line.trim().toUpperCase() === '__DONE__') continue;
          append(line);
        }
        offset = data.offset != null ? data.offset : offset;
        done = !!data.done;
        if (!done) await new Promise(res => setTimeout(res, POLL_MS));
      }
      statusEl.textContent = done ? 'completed' : 'timed out';
    } catch (err) {
      append(String(err), 'err');
      statusEl.textContent = 'error';
    } finally {
      buttons.forEach(b => (b.disabled = false));
    }
  }

  document.querySelectorAll('header button').forEach(btn =>
    btn.addEventListener('click', () => run(btn.dataset.q))
  );
</script>
</body>
</html>
