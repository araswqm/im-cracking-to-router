<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYD Control — Live Log</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; border-bottom: 1px solid #30363d; display: flex; gap: 8px;
           flex-wrap: wrap; align-items: center; }
  header button { background: #21262d; color: #e6edf3; border: 1px solid #30363d;
                  border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  header button:hover:not(:disabled) { background: #30363d; }
  header button:disabled { opacity: .45; cursor: not-allowed; }
  #status { margin-left: auto; font-size: 13px; color: #8b949e; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; white-space: pre-wrap;
         word-break: break-word; font-size: 13px; line-height: 1.6; }
  #log .ts { color: #58a6ff; }
  #log .err { color: #f85149; }
  #log .done { color: #3fb950; }
</style>
</head>
<body>
<header>
  <button data-q="lock">Lock</button>
  <button data-q="unlock">Unlock</button>
  <button data-q="headlights">Headlights</button>
  <button data-q="honk">Honk</button>
  <button data-q="trunk_open">Trunk Open</button>
  <button data-q="trunk_close">Trunk Close</button>
  <button data-q="windows_close">Windows Close</button>
  <button data-q="engine_off">Engine Off</button>
  <span id="status">idle</span>
</header>
<pre id="log"></pre>
<script>
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  // Optional API key: /control.html?key=YOUR_KEY (or pass &key= on each call)
  const apiKey = new URLSearchParams(location.search).get('key') || '';

  const stamp = () => new Date().toLocaleTimeString();

  function append(text, cls) {
    const div = document.createElement('div');
    const t = document.createElement('span');
    t.className = 'ts';
    t.textContent = `[${stamp()}] `;
    div.appendChild(t);
    const body = document.createElement('span');
    body.textContent = text;
    if (cls) body.className = cls;
    div.appendChild(body);
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function run(q) {
    logEl.textContent = '';
    const buttons = document.querySelectorAll('header button');
    buttons.forEach(b => (b.disabled = true));
    statusEl.textContent = 'connecting…';

    const url = `/api/control?q=${encodeURIComponent(q)}`
      + (apiKey ? `&key=${encodeURIComponent(apiKey)}` : '');

    try {
      const resp = await fetch(url);
      if (!resp.ok) {
        const detail = await resp.text().catch(() => '');
        append(`HTTP ${resp.status} ${detail}`.trim(), 'err');
        statusEl.textContent = `failed (HTTP ${resp.status})`;
        return;
      }
      // Read the stream chunk-by-chunk so lines appear the moment they arrive.
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let ended = false;
      while (true) {
        const { done, value } = await reader.read();
        if (done) { ended = true; break; }
        buffer += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buffer.indexOf('\n')) >= 0) {
          const line = buffer.slice(0, nl).trimEnd();
          buffer = buffer.slice(nl + 1);
          if (line) append(line);
        }
      }
      if (buffer.trim()) append(buffer.trimEnd());
      statusEl.textContent = ended ? 'completed' : 'stream closed';
    } catch (err) {
      append(String(err), 'err');
      statusEl.textContent = 'error';
    } finally {
      buttons.forEach(b => (b.disabled = false));
    }
  }

  document.querySelectorAll('header button').forEach(btn =>
    btn.addEventListener('click', () => run(btn.dataset.q))
  );
</script>
</body>
</html>
